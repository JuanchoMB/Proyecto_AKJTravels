openapi: 3.0.3
info:
  title: API Proyecto Final - Plataforma de Alojamientos
  description: >
    Especificación de la API REST para el proyecto final de Programación Avanzada.
    Esto incluye la gestión de usuarios, anfitriones, alojamientos, reservas, comentarios
    y métricas. Cumple con los lineamientos de OpenAPI 3.0.
  version: "1.0.0"
servers:
  - url: http://localhost:8080/api
    description: Servidor local de desarrollo

tags:
  - name: Autenticación
  - name: Usuarios
  - name: Alojamientos
  - name: Reservas
  - name: Comentarios
  - name: Métricas

paths:
  /auth/register:
    post:
      tags: [Autenticación]
      summary: Registrar un nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioRegistro"
      responses:
        "201":
          description: Usuario registrado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Datos inválidos
        "409":
          description: El usuario ya existe
        "500":
          description: Error interno del servidor

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión de usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Inicio de sesión exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Credenciales inválidas
        "500":
          description: Error interno del servidor

  /usuarios/{id}:
    get:
      tags: [Usuarios]
      summary: Obtener información de un usuario
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Información del usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "404":
          description: Usuario no encontrado
        "500":
          description: Error interno
    put:
      tags: [Usuarios]
      summary: Editar información de un usuario
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioUpdate"
      responses:
        "200":
          description: Usuario actualizado correctamente
        "400":
          description: Datos inválidos
        "404":
          description: Usuario no encontrado
        "500":
          description: Error interno
    delete:
      tags: [Usuarios]
      summary: Eliminar usuario
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        "204":
          description: Usuario eliminado
        "404":
          description: Usuario no encontrado
        "500":
          description: Error interno

  /alojamientos:
    get:
      tags: [Alojamientos]
      summary: Listar todos los alojamientos
      responses:
        "200":
          description: Lista de alojamientos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alojamiento"
        "500":
          description: Error interno
    post:
      tags: [Alojamientos]
      summary: Crear un alojamiento (solo anfitrión)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlojamientoCreate"
      responses:
        "201":
          description: Alojamiento creado
        "400":
          description: Datos inválidos
        "403":
          description: Usuario no autorizado
        "500":
          description: Error interno

  /alojamientos/{id}:
    get:
      tags: [Alojamientos]
      summary: Obtener un alojamiento por ID
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Información del alojamiento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alojamiento"
        "404":
          description: Alojamiento no encontrado
    put:
      tags: [Alojamientos]
      summary: Editar un alojamiento (solo anfitrión)
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlojamientoUpdate"
      responses:
        "200":
          description: Alojamiento actualizado
        "400":
          description: Datos inválidos
        "403":
          description: Usuario no autorizado
        "404":
          description: Alojamiento no encontrado
    delete:
      tags: [Alojamientos]
      summary: Eliminar un alojamiento (solo anfitrión)
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        "204":
          description: Alojamiento eliminado
        "403":
          description: Usuario no autorizado
        "404":
          description: Alojamiento no encontrado

  /reservas:
    post:
      tags: [Reservas]
      summary: Crear una reserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservaCreate"
      responses:
        "201":
          description: Reserva creada correctamente
        "400":
          description: Datos inválidos
        "404":
          description: Alojamiento no encontrado
        "500":
          description: Error interno
    get:
      tags: [Reservas]
      summary: Listar todas las reservas de un usuario
      responses:
        "200":
          description: Lista de reservas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reserva"
        "500":
          description: Error interno

  /reservas/{id}/cancelar:
    put:
      tags: [Reservas]
      summary: Cancelar una reserva
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Reserva cancelada correctamente
        "404":
          description: Reserva no encontrada
        "403":
          description: No autorizado a cancelar esta reserva
        "500":
          description: Error interno

  /comentarios:
    post:
      tags: [Comentarios]
      summary: Crear un comentario sobre un alojamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComentarioCreate"
      responses:
        "201":
          description: Comentario agregado
        "400":
          description: Datos inválidos
        "404":
          description: Alojamiento no encontrado
        "500":
          description: Error interno

  /metricas:
    get:
      tags: [Métricas]
      summary: Obtener métricas generales de la aplicación
      responses:
        "200":
          description: Métricas del sistema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Metricas"
        "500":
          description: Error interno

components:
  schemas:
    UsuarioRegistro:
      type: object
      properties:
        nombre:
          type: string
        email:
          type: string
        password:
          type: string
        rol:
          type: string
          enum: [usuario, anfitrion]
      required: [nombre, email, password, rol]

    UsuarioUpdate:
      type: object
      properties:
        nombre:
          type: string
        email:
          type: string
        password:
          type: string

    Usuario:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        email:
          type: string
        rol:
          type: string
          enum: [usuario, anfitrion]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        usuario:
          $ref: "#/components/schemas/Usuario"

    AlojamientoCreate:
      type: object
      properties:
        titulo:
          type: string
        descripcion:
          type: string
        ubicacion:
          type: string
        precioPorNoche:
          type: number
        capacidad:
          type: integer
      required: [titulo, descripcion, ubicacion, precioPorNoche, capacidad]

    AlojamientoUpdate:
      type: object
      properties:
        titulo:
          type: string
        descripcion:
          type: string
        ubicacion:
          type: string
        precioPorNoche:
          type: number
        capacidad:
          type: integer

    Alojamiento:
      allOf:
        - $ref: "#/components/schemas/AlojamientoCreate"
        - type: object
          properties:
            id:
              type: string
            anfitrionId:
              type: string

    ReservaCreate:
      type: object
      properties:
        alojamientoId:
          type: string
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
      required: [alojamientoId, fechaInicio, fechaFin]

    Reserva:
      allOf:
        - $ref: "#/components/schemas/ReservaCreate"
        - type: object
          properties:
            id:
              type: string
            usuarioId:
              type: string
            estado:
              type: string
              enum: [activa, cancelada, completada]

    ComentarioCreate:
      type: object
      properties:
        alojamientoId:
          type: string
        usuarioId:
          type: string
        texto:
          type: string
        calificacion:
          type: integer
          minimum: 1
          maximum: 5
      required: [alojamientoId, usuarioId, texto, calificacion]

    Comentario:
      allOf:
        - $ref: "#/components/schemas/ComentarioCreate"
        - type: object
          properties:
            id:
              type: string
            fecha:
              type: string
              format: date-time

    Metricas:
      type: object
      properties:
        totalUsuarios:
          type: integer
        totalAlojamientos:
          type: integer
        totalReservas:
          type: integer
        totalComentarios:
          type: integer
